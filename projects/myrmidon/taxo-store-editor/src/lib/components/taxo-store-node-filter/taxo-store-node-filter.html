<div class="filter" [class.wrapped]="wrapped">
  <div class="form-row">
    <mat-form-field>
      <mat-label>label</mat-label>
      <input matInput [formField]="form.label" (keydown.enter)="apply()" />
    </mat-form-field>

    <mat-form-field class="flags-field">
      <mat-label>flags</mat-label>
      <input matInput [formField]="form.flags" (keydown.enter)="apply()" />
    </mat-form-field>
  </div>

  <div class="form-row actions">
    <button
      type="button"
      mat-icon-button
      matTooltip="Reset filter"
      aria-label="Reset filter"
      (click)="reset()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Apply filter"
      aria-label="Apply filter"
      [disabled]="form().invalid()"
      (click)="apply()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
